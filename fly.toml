# Fly.io config — recommended free path with real persistence.
#   fly launch --no-deploy   (adopts this config)
#   fly volumes create ajaia_data --size 1
#   fly deploy
app = "ajaia-docs"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/ajaia.db"

[mounts]
  source = "ajaia_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
