# Render blueprint. Works on BOTH free and paid plans.
#
# The app resolves its database path at boot: it uses DB_PATH (/data/ajaia.db)
# when a persistent disk is mounted there (paid plan), and automatically falls
# back to a local ephemeral file when /data isn't writable (free plan). So the
# same repo deploys cleanly either way — on free, the DB resets on restart and
# the three demo users re-seed on each boot.
#
# To add real persistence on a paid plan, attach a disk mounted at /data
# (Dashboard → your service → Disks → Add Disk → mount path /data). No code
# change is needed; the app will pick it up on the next deploy.
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_PATH
        value: /data/ajaia.db
